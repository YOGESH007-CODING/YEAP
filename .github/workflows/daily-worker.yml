name: Daily Review Queue Worker

on:
  schedule:
    # Runs daily at 4:00 AM UTC (adjust if needed)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-daily-worker:
    name: Run Morning Review Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Daily Queue Worker Batch
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_FROM_EMAIL: ${{ secrets.NOTIFICATION_FROM_EMAIL }}
        run: npx ts-node src/infrastructure/workers/runWorkerOnce.ts
